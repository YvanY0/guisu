[workspace]
members = [
  "crates/cli",
  "crates/config",
  "crates/core",
  "crates/crypto",
  "crates/engine",
  "crates/template",
  "crates/vault",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
authors = ["Yihuang Yu <yuyihuang@live.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/YvanY0/guisu"
homepage = "https://github.com/YvanY0/guisu"
keywords = ["dotfiles"]
documentation = "https://github.com/YvanY0/guisu"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
unwrap_used = "deny"
todo = "warn"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive", "cargo", "env"] }
crossterm = "0.29"
ratatui = "0.30"
terminal_size = "0.4"
indicatif = "0.18"

anyhow = "1.0"
thiserror = "2.0"
miette = { version = "7.6", features = ["fancy"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
postcard = { version = "1.1", default-features = false, features = ["alloc"] }

age = { version = "0.11.3", features = ["ssh", "armor"] }
secrecy = "0.10"
sha2 = "0.11"
subtle = "2.6"
base64 = "0.22"

dirs = "6.0"
ignore = "0.4"
walkdir = "2.5"
tempfile = "3.27"
which = "8.0"

minijinja = { version = "2.20", features = ["builtins", "loader"] }
regex = "1.12"

indexmap = { version = "2.14", features = ["serde"] }
bitflags = "2.13"

rayon = "1.12"

redb = "4.1"
git2 = "0.20"
git2_credentials = "0.15"
similar = "3.1"
os_info = "3.15"
libc = "0.2"
chrono = "0.4"
duct = "1.1"
shell-words = "1.1"
blake3 = "1.8"
hex = "0.4"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "fmt",
  "ansi",
] }

vergen = { version = "9.1", features = ["build", "rustc"] }
vergen-git2 = { version = "9.1", features = ["build"] }

assert_cmd = "2.2"
assert_fs = "1.1"
predicates = "3.1"
serial_test = "3.5"
temp-env = "0.3"

criterion = { version = "0.8", features = ["html_reports"] }

xdg = "3.0"
hostname = "0.4"
lru = "0.18.0"
rustix = { version = "1.1", features = ["process", "system"] }
uzers = "0.12"
comfy-table = "7.2"
dialoguer = "0.12"
lscolors = "0.21"
nu-ansi-term = "0.50"
owo-colors = "4.3"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
