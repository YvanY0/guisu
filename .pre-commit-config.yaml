default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

ci:
  autofix_prs: false
  autoupdate_schedule: monthly

repos:
  - repo: local
    hooks:
      - id: cargo-fmt-pre-push
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]
      - id: cargo-clippy-pre-push
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]
      - id: cargo-check-pre-push
        name: cargo check
        entry: cargo check --workspace --all-targets
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]
      - id: cargo-test-pre-push
        name: cargo test
        entry: cargo test --workspace --all-features
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]
      - id: cargo-deny-pre-push
        name: cargo deny
        entry: cargo deny check advisories licenses bans sources
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
  - repo: https://github.com/ComPWA/mirrors-taplo
    rev: v0.9.3
    hooks:
      - id: taplo-format
      - id: taplo-lint
        args: ["--no-schema"]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/adhtruong/mirrors-typos
    rev: v1.48.0
    hooks:
      - id: typos
        args: ["--force-exclude"]
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.26.0
    hooks:
      - id: commitlint
        additional_dependencies: ["@commitlint/config-conventional"]
        stages: [commit-msg]
