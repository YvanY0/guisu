name: Rust CI

on:
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/rust.yml"
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/rust.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTFLAGS: -Dwarnings

jobs:
  rust:
    name: Rust workspace checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Only persist the cache on main-branch pushes; PRs (including
          # dependabot forks) still restore from it but never write back,
          # which prevents a flood of stale keys from poisoning the namespace.
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2.87.1
        with:
          tool: cargo-deny

      - name: Install cargo-outdated
        uses: taiki-e/install-action@v2.87.1
        with:
          tool: cargo-outdated

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2.87.1
        with:
          tool: cargo-llvm-cov

      # LCOV report: runs the test suite through cargo-llvm-cov which
      # instruments at the LLVM level (no source changes, faster than
      # coverage runs that go through cargo test directly).
      - name: Coverage (lcov)
        run: cargo llvm-cov test --lcov --output-path lcov.info --locked --all-features --workspace

      # Codecov is informational — failure here does NOT block CI. The
      # token is optional; without it the upload is silently skipped and
      # the lcov.info artifact is still produced for local inspection.
      - name: Upload coverage
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: false

      - name: Deny (advisories, licenses, bans, sources)
        run: cargo deny check advisories licenses bans sources

      - name: Install cargo-shear
        uses: taiki-e/install-action@v2.87.1
        with:
          tool: cargo-shear

      - name: Shear (unused deps)
        run: cargo shear --all-features

      - name: Outdated
        run: cargo outdated --root-deps-only --workspace
        continue-on-error: true
