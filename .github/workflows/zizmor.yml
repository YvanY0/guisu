name: zizmor

# Scans .github/workflows/*.yml for unsafe GH Actions patterns
# (unpinned actions, script injections, excessive permissions, ...).
# Runs on any PR or push that touches the workflow directory.

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/zizmor.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/zizmor.yml"

permissions:
  contents: read
  # zizmor-action's post-step uploads SARIF to the GitHub Code Scanning
  # API (CodeQL Action under the hood). Without security-events: write
  # that upload fails with "Resource not accessible by integration"
  # and the job ends in failure even when the zizmor scan itself
  # succeeded.
  security-events: write

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: zizmor security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@v0.6.4
        with:
          # Scan every workflow in the repo; fail the job on any finding
          # at or above the 'medium' severity threshold.
          min-severity: medium
