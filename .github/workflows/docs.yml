name: docs
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:  # 'Run workflow' button on the Actions tab
permissions:
  contents: read
concurrency:
  group: docs
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: '3.12'
      - name: Build
        run: uvx --from zensical zensical build --strict

      # Generate llms.txt + llms-full.txt from the built site so LLM
      # tools (Claude/Cursor/...) can pull guisu docs as plain markdown
      # instead of scraping HTML. Output lands in site/ and ships with
      # the GH Pages artifact.
      - name: Generate llms.txt
        run: uvx --from llmstxt-standalone llmstxt-standalone build --site-dir site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
