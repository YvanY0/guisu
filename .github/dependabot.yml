version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
      - "auto-merge"
    rebase-strategy: "auto"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "git2"
        # 0.20 -> 0.21 requires libgit2-sys rebuild; revisit when
        # 0.21 lands in stable libgit2 release matrix.
      - dependency-name: "git2_credentials"
        # Tracks git2; ignore together.
    groups:
      rust-direct:
        dependency-type: "production"
        patterns:
          - "*"
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"
      - "auto-merge"
    rebase-strategy: "auto"
