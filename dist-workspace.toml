[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# Allow CI workflow edits to bypass dist's dirty-working-tree check.
# Editing .github/workflows/release.yml + bumping the dist binary in the same
# PR otherwise trips dist's safety net.
allow-dirty = ["ci"]
# PRs only run `dist plan` (dry-run); tag push runs the full build matrix.
# Personal dev: PR minute budget matters, tag-push stays fully automatic.
pr-run-mode = "skip"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Whether to install an updater program
install-updater = false
# GitHub Artifact Attestations: free SLSA provenance for every release artifact.
# Renders the "Verified" badge on the Release page without running cosign.
github-attestations = true
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "YvanY0/homebrew-tap"
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
