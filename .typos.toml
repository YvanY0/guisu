[default.extend-words]
# Legitimate library and company names
ratatui = "ratatui"
Hashi = "Hashi"
HashiCorp = "HashiCorp"
# 'non-existant' retained as a legitimate variant. (Originally added as a
# workaround for an upstream mdbook CSS API misspelling; mdbook has since
# been removed.)
non-existant = "non-existant"

[default]
# Ignore Unicode escape sequences
extend-ignore-re = ['\\u\{[0-9a-fA-F]+\}']

[files]
extend-exclude = ["*.lock", "target/"]
