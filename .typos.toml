[default.extend-words]
# Legitimate library and company names
ratatui = "ratatui"
Hashi = "Hashi"
HashiCorp = "HashiCorp"
# Upstream mdbook 0.4 and 0.5 both use this misspelling for the
# 'sidebar non-existent entry' CSS custom property; renaming our
# variable would break the Nord override.
non-existant = "non-existant"

[default]
# Ignore Unicode escape sequences
extend-ignore-re = ['\\u\{[0-9a-fA-F]+\}']

[files]
# mdbook-mermaid's minified bundle ships with ~140 single- and
# double-character identifier names that look like typos but are
# real mermaid-internal symbols. The file is third-party and we
# do not edit it; exclude it from the typo check.
extend-exclude = ["*.lock", "target/", "docs/mermaid.min.js"]
